<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plate Watch</title>
<style>
  :root { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color:#fff; background:#101214; }
  body { margin:0; }
  header { padding:14px; position:sticky; top:0; background:#101214; z-index:5; }
  .controls { display:grid; grid-template-columns:1fr auto auto; gap:8px; }
  input,button { font:inherit; border-radius:10px; border:0; padding:12px; }
  input { min-width:0; }
  button { background:#2b7cff; color:white; font-weight:700; cursor:pointer; }
  button.secondary { background:#30343a; }
  #stage { position:relative; width:100%; max-width:900px; margin:auto; background:#000; overflow:hidden; }
  video,canvas { width:100%; display:block; }
  #overlay { position:absolute; inset:0; pointer-events:none; }
  .plate { position:absolute; border:3px solid #35d05a; box-sizing:border-box; border-radius:5px; transition: all 0.1s ease-out; }
  .plate.target { border-color:#ff3b30; box-shadow:0 0 0 2px rgba(255,59,48,.25); }
  .label { position:absolute; top:-25px; left:0; padding:2px 6px; font-size:12px; white-space:nowrap; border-radius:4px; background:#35d05a; color:#071207; }
  .target .label { background:#ff3b30; color:#fff; }
  #status { padding:10px 14px; color:#c7ccd4; font-size:14px; }
  #logs { padding:14px; max-width:900px; margin:auto; }
  .log { background:#1b1e22; padding:10px; border-radius:10px; margin:8px 0; display:flex; gap:10px; align-items:center; }
  .log img { width:100px; height:65px; object-fit:cover; border-radius:6px; }
  .small { font-size:12px; color:#aab0b9; }
</style>
</head>
<body>
<header>
  <div class="controls">
    <input id="plateInput" placeholder="Add plate (e.g. ABC123)" autocomplete="off">
    <button id="addPlate">Add plate</button>
    <button id="start">Start camera</button>
    <button class="secondary" id="clear">Clear logs</button>
  </div>
  <div id="watchList" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px"></div>
</header>

<div id="stage">
  <video id="video" playsinline muted></video>
  <div id="overlay"></div>
</div>
<div id="status">Enter a plate and tap Start camera. Camera and location permissions are requested by the browser.</div>
<canvas id="work" hidden></canvas>

<section id="logs"><h2>Detection log</h2><div id="logItems"></div></section>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), work = $('work'), overlay = $('overlay');
const plateInput = $('plateInput'), statusEl = $('status'), logItems = $('logItems');
const watchListEl = $('watchList');

let stream, running = false, processing = false, lastAlert = 0, latestLocation = null;
let worker = null;
let lastAnalysisTime = 0;
const ANALYSIS_INTERVAL = 350; // Throttle OCR to ~3 FPS in background without slowing down video 60 FPS UI

const normalise = s => (s || '').toUpperCase().replace(/[^A-Z0-9]/g,'');

let watchPlates = JSON.parse(localStorage.getItem('plateWatchList') || '[]')
  .map(normalise).filter(Boolean);

function saveWatchList() {
  watchPlates = [...new Set(watchPlates)];
  localStorage.setItem('plateWatchList', JSON.stringify(watchPlates));
  renderWatchList();
}

function renderWatchList() {
  watchListEl.innerHTML = watchPlates.length
    ? watchPlates.map(p => `<span style="background:#30343a;padding:7px 10px;border-radius:999px;font-size:14px">
        <b>${p}</b>
        <button data-remove="${p}" style="margin-left:6px;padding:1px 6px;background:#ff3b30;border-radius:999px">×</button>
      </span>`).join('')
    : '<span class="small">No plates in watch list yet.</span>';

  watchListEl.querySelectorAll('[data-remove]').forEach(btn => {
    btn.onclick = () => {
      watchPlates = watchPlates.filter(p => p !== btn.dataset.remove);
      saveWatchList();
    };
  });
}

$('addPlate').onclick = () => {
  const plate = normalise(plateInput.value);
  if (!plate) { alert('Enter a valid plate number.'); return; }
  if (watchPlates.includes(plate)) { alert('That plate is already in the watch list.'); return; }
  watchPlates.push(plate);
  saveWatchList();
  plateInput.value = '';
  plateInput.focus();
};

plateInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') $('addPlate').click();
});

renderWatchList();

function setStatus(s){ statusEl.textContent = s; }

async function getLocation() {
  if (!navigator.geolocation) return null;
  return new Promise(resolve => navigator.geolocation.getCurrentPosition(
    p => resolve({lat:p.coords.latitude, lon:p.coords.longitude, accuracy:p.coords.accuracy}),
    () => resolve(null),
    {enableHighAccuracy:true, timeout:10000, maximumAge:30000}
  ));
}

// Initialize Tesseract Worker with Whitelist & Fast Engine mode
async function initWorker() {
  setStatus('Initializing fast OCR engine...');
  worker = await Tesseract.createWorker('eng', 1, {
    corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.0.0',
    logger: () => {}
  });
  // Restrict parameters to alphanumeric uppercase for faster execution
  await worker.setParameters({
    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
    tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT,
  });
  setStatus('Engine ready. Tap Start camera.');
}
initWorker();

$('start').onclick = async () => {
  if (!watchPlates.length) { alert('Add at least one plate to the watch list first.'); return; }
  if (!navigator.mediaDevices?.getUserMedia) { alert('This browser does not support camera access.'); return; }

  try {
    latestLocation = await getLocation();
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    running = true;
    $('start').textContent = 'Running';
    $('start').disabled = true;
    setStatus('Scanning smoothly at 60fps…');
    
    // Start non-blocking render loop
    requestAnimationFrame(processLoop);
  } catch (e) {
    console.error(e);
    setStatus('Could not start camera/location: ' + e.message);
  }
};

$('clear').onclick = () => { localStorage.removeItem('plateWatchLogs'); renderLogs(); };

function saveLog(item) {
  const logs = JSON.parse(localStorage.getItem('plateWatchLogs') || '[]');
  logs.unshift(item);
  localStorage.setItem('plateWatchLogs', JSON.stringify(logs.slice(0,100)));
  renderLogs();
}

function renderLogs() {
  const logs = JSON.parse(localStorage.getItem('plateWatchLogs') || '[]');
  logItems.innerHTML = logs.map(x => `
    <div class="log">
      <img src="${x.photo}" alt="vehicle snapshot">
      <div><b>${x.plate}</b><div class="small">${new Date(x.time).toLocaleString()}</div>
      <div class="small">${x.location ? `${x.location.lat.toFixed(6)}, ${x.location.lon.toFixed(6)} ±${Math.round(x.location.accuracy||0)}m` : 'Location unavailable'}</div></div>
    </div>`).join('') || '<div class="small">No detections yet.</div>';
}
renderLogs();

function drawBox(x, y, w, h, text, isTarget, scale) {
  const sx = (video.clientWidth / video.videoWidth) / scale;
  const sy = (video.clientHeight / video.videoHeight) / scale;
  
  const box = document.createElement('div');
  box.className = 'plate' + (isTarget ? ' target' : '');
  Object.assign(box.style, {
    left: (x * sx) + 'px',
    top: (y * sy) + 'px',
    width: (w * sx) + 'px',
    height: (h * sy) + 'px'
  });
  const label = document.createElement('div');
  label.className = 'label'; 
  label.textContent = text || (isTarget ? 'WATCH PLATE' : 'PLATE');
  box.appendChild(label); 
  overlay.appendChild(box);
}

function snapshot() {
  const c = document.createElement('canvas');
  c.width = video.videoWidth; 
  c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  return c.toDataURL('image/jpeg', 0.8);
}

async function alertTarget(plate) {
  const now = Date.now();
  if (now - lastAlert < 10000) return;
  lastAlert = now;
  latestLocation = await getLocation() || latestLocation;
  const item = { plate, time: new Date().toISOString(), location: latestLocation, photo: snapshot() };
  saveLog(item);

  if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
  setStatus(`ALERT: ${plate} detected and logged.`);
}

async function runOCR() {
  if (processing || !worker || video.readyState < 2) return;
  processing = true;

  try {
    // 1. Lower canvas resolution dedicated for OCR processing (480px width max)
    const scale = Math.min(1, 480 / video.videoWidth);
    work.width = Math.round(video.videoWidth * scale);
    work.height = Math.round(video.videoHeight * scale);
    
    const ctx = work.getContext('2d', { willReadFrequently: true });
    
    // 2. Pre-process frame: Convert to grayscale & contrast boost for rapid OCR text extraction
    ctx.drawImage(video, 0, 0, work.width, work.height);
    const imgData = ctx.getImageData(0, 0, work.width, work.height);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) > 120 ? 255 : 0;
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);

    // 3. Recognize asynchronously without blocking UI thread
    const { data } = await worker.recognize(work);

    overlay.innerHTML = '';
    let hits = new Set();

    for (const word of (data.words || [])) {
      const plate = normalise(word.text);
      if (plate.length < 3 || plate.length > 8) continue;
      const b = word.bbox;
      const isTarget = watchPlates.includes(plate);
      
      drawBox(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0, plate, isTarget, scale);
      
      if (isTarget) hits.add(plate);
    }

    if (hits.size) {
      for (const hit of hits) await alertTarget(hit);
    }
  } catch (e) {
    console.warn(e);
  } finally {
    processing = false;
  }
}

// Native 60 FPS RequestAnimationFrame Loop
function processLoop(timestamp) {
  if (!running) return;

  // Run heavy OCR pipeline at throttled intervals in background worker
  if (timestamp - lastAnalysisTime > ANALYSIS_INTERVAL) {
    lastAnalysisTime = timestamp;
    runOCR();
  }

  // Keep 60fps video rendering active continuously
  requestAnimationFrame(processLoop);
}
</script>
</body>
</html>
